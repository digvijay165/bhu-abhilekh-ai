<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terra Trust — AI-Verified Land Records &amp; Citizen Services</title>

<style>
  :root{
    --brand:#1c7a4b;
    --brand-dark:#125c38;
    --brand-light:#e3f5ea;
    --navy:#0f2036;
    --navy-2:#16304e;
    --orange:#e8622c;
    --orange-light:#fce8de;
    --amber:#b9770e;
    --amber-light:#fdf1de;
    --blue:#2f6fb3;
    --blue-light:#e7f0fb;
    --purple:#6b4fa0;
    --purple-light:#f0eaf9;
    --red:#c0392b;
    --red-light:#fbe6e3;
    --ink:#152033;
    --muted:#5c6b7a;
    --bg:#f4f6f5;
    --card:#ffffff;
    --border:#e4e8e6;
    --radius:14px;
    --shadow:0 4px 18px rgba(15,32,54,0.07);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    padding-bottom:64px;
  }
  img{max-width:100%;}
  button{font-family:inherit;}
  a{color:inherit;}
  .container{max-width:1180px;margin:0 auto;padding:0 24px;}
  h1,h2,h3,h4{margin:0 0 8px;font-family:'Georgia','Times New Roman',serif;color:var(--navy);}
  .eyebrow{
    text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700;
    color:var(--brand);margin-bottom:8px;
  }
  .section{padding:40px 0;}
  .section-tight{padding:28px 0;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:none;
    font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;
    transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(28,122,75,0.3);}
  .btn-dark{background:var(--navy);color:#fff;}
  .btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--border);}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.3px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}

  /* ---------- top utility bar ---------- */
  .topbar{background:var(--navy);color:#b9c9d8;font-size:12px;padding:7px 0;}
  .topbar .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .topbar b{color:#fff;}
  .topbar .phone{display:flex;align-items:center;gap:6px;color:#fff;font-weight:700;}

  /* ---------- header ---------- */
  header.main{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--border);}
  .header-inner{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-weight:800;font-size:18px;flex:none;
  }
  .brand-text b{display:block;font-size:16px;color:var(--navy);line-height:1.15;}
  .brand-text span{font-size:11px;color:var(--muted);}

  nav.tabs{display:flex;gap:4px;}
  nav.tabs button{
    background:none;border:none;padding:9px 14px;border-radius:9px;font-size:13.5px;font-weight:600;
    color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  nav.tabs button.active{background:var(--brand-light);color:var(--brand-dark);}
  nav.tabs button:hover{color:var(--brand-dark);}
  @media (max-width:960px){ nav.tabs{display:none;} }

  .header-actions{display:flex;align-items:center;gap:8px;flex:none;}
  .icon-btn{
    position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);
  }
  .icon-btn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff;}
  .lang-toggle{
    display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;font-size:12px;font-weight:700;
  }
  .lang-toggle button{border:none;background:#fff;color:var(--muted);padding:7px 11px;cursor:pointer;}
  .lang-toggle button.active{background:var(--navy);color:#fff;}
  .avatar{
    width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;cursor:pointer;flex:none;
  }
  .dropdown{
    position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(15,32,54,0.18);
    width:280px;z-index:80;overflow:hidden;
  }
  .dropdown-head{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);}
  .notif-item{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;}
  .notif-item:last-child{border-bottom:none;}
  .notif-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none;}
  .notif-item .t{color:var(--muted);font-size:11px;margin-top:2px;}
  .menu-item{padding:12px 16px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;color:var(--navy);}
  .menu-item:last-child{border-bottom:none;}
  .menu-item:hover{background:var(--bg);}
  .rel{position:relative;}

  /* ---------- advisory banner ---------- */
  .advisory{background:var(--brand-light);border-bottom:1px solid #c9e9d6;padding:9px 0;}
  .advisory .container{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--brand-dark);font-weight:700;flex-wrap:wrap;}
  .live-pill{background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:1px;}

  /* ---------- hero ---------- */
  .hero{padding:44px 0 20px;}
  .hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:36px;align-items:start;}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr;}}
  .hero h1{font-size:36px;line-height:1.15;margin-bottom:12px;}
  .hero p.lead{color:var(--muted);font-size:15.5px;max-width:520px;margin-bottom:22px;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;}

  /* cadastral card */
  .cadastral{padding:20px;}
  .cadastral-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .cadastral-head .tag{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
  .cadastral-title{font-size:20px;font-family:Georgia,serif;color:var(--navy);font-weight:700;margin:2px 0 12px;}
  .cadastral-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .cadastral-badges{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;}
  .cadastral-meta{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border);padding-top:12px;margin-top:6px;font-size:12.5px;color:var(--muted);}
  .mini-map{
    height:80px;border-radius:10px;margin:10px 0 4px;position:relative;overflow:hidden;
    background:
      linear-gradient(0deg, rgba(28,122,75,0.09) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(28,122,75,0.09) 1px, transparent 1px) 0 0/18px 18px,
      var(--brand-light);
    border:1px solid #c9e9d6;
  }
  .mini-pin{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--orange);transform:rotate(-45deg);box-shadow:0 3px 8px rgba(0,0,0,0.25);}

  /* status tracker */
  .tracker{padding:20px;margin-top:16px;}
  .tracker-row{display:flex;gap:10px;margin-bottom:6px;}
  .tracker-row input{
    flex:1;padding:11px 14px;border-radius:9px;border:1.5px solid var(--border);font-size:13.5px;outline:none;
  }
  .tracker-row input:focus{border-color:var(--brand);}
  .tracker-hint{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  .tracker-hint b{color:var(--brand-dark);cursor:pointer;text-decoration:underline;}

  .docket{border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:14px;background:#fbfcfb;}
  .docket-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
  .docket-id{font-size:13px;color:var(--muted);}
  .docket-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;margin-bottom:14px;}
  .docket-fields div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  .docket-fields div b{color:var(--navy);font-weight:600;font-size:13px;}
  .progress-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .progress-track{display:flex;gap:4px;margin-bottom:6px;}
  .progress-seg{flex:1;height:7px;border-radius:4px;background:var(--border);}
  .progress-seg.done{background:var(--brand);}
  .progress-dates{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:14px;}
  .docket-actions{display:flex;gap:10px;flex-wrap:wrap;}

  /* status badges */
  .status-in-review{background:var(--amber-light);color:var(--amber);}
  .status-approved{background:var(--brand-light);color:var(--brand-dark);}
  .status-submitted{background:var(--blue-light);color:var(--blue);}
  .status-verified{background:var(--brand-light);color:var(--brand-dark);}

  /* ---------- section head ---------- */
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:24px;margin-bottom:2px;}
  .section-head p{color:var(--muted);font-size:13.5px;margin:0;}
  .see-all{font-size:13px;font-weight:700;color:var(--brand-dark);display:flex;align-items:center;gap:4px;cursor:pointer;background:none;border:none;}

  /* ---------- services grid ---------- */
  .services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:860px){.services-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:560px){.services-grid{grid-template-columns:1fr;}}
  .service-card{padding:18px;cursor:pointer;transition:border-color .15s;}
  .service-card:hover{border-color:var(--brand);}
  .service-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .service-icon{
    width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;
  }
  .service-card h4{font-size:15px;margin-bottom:4px;}
  .service-card p{font-size:12.5px;color:var(--muted);margin:0;}

  /* ---------- knowledge hub ---------- */
  .guide-row{
    display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;
  }
  .guide-row:last-child{border-bottom:none;}
  .guide-row:hover{background:var(--bg);}
  .guide-icon{
    width:38px;height:38px;border-radius:10px;background:var(--brand-light);color:var(--brand-dark);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .guide-row b{display:block;font-size:14px;color:var(--navy);}
  .guide-row span{font-size:12px;color:var(--muted);}
  .guide-row .chev{margin-left:auto;color:var(--muted);flex:none;}

  /* ---------- disclaimer ---------- */
  .disclaimer{background:var(--blue-light);border:1px solid #bcd6f2;border-radius:var(--radius);padding:18px 20px;font-size:13px;color:#2a4763;}
  .disclaimer b{color:var(--navy);}
  .trust-row{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--blue);}

  /* ---------- floating help ---------- */
  .float-help{
    position:fixed;left:0;right:0;bottom:64px;z-index:40;display:flex;justify-content:center;pointer-events:none;
  }
  @media (min-width:961px){.float-help{bottom:20px;}}
  .float-help-inner{
    pointer-events:auto;max-width:1132px;width:calc(100% - 48px);background:var(--navy);color:#fff;border-radius:14px;
    padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,0.25);gap:12px;flex-wrap:wrap;
  }
  .float-help-inner .left{display:flex;align-items:center;gap:12px;}
  .float-help-inner .left b{display:block;font-size:14px;}
  .float-help-inner .left span{font-size:11.5px;color:#9fb0c4;}
  .float-help-actions{display:flex;gap:8px;}
  .float-help-actions .btn{padding:9px 16px;font-size:12.5px;}

  /* ---------- bottom mobile nav ---------- */
  .bottom-nav{
    display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
    z-index:70;padding:6px 4px;box-shadow:0 -6px 16px rgba(0,0,0,0.05);
  }
  @media (max-width:960px){.bottom-nav{display:flex;}}
  .bottom-nav button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 2px;font-size:10.5px;color:var(--muted);cursor:pointer;font-weight:600;
  }
  .bottom-nav button.active{color:var(--brand-dark);}

  .more-sheet{
    position:fixed;bottom:60px;left:12px;right:12px;background:#fff;border-radius:16px;box-shadow:0 -10px 30px rgba(0,0,0,0.2);
    z-index:75;overflow:hidden;border:1px solid var(--border);
  }

  /* ---------- record / land records tab ---------- */
  .search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .search-input{flex:1;min-width:220px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;outline:none;}
  .search-input:focus{border-color:var(--brand);}
  .search-btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:13.5px;}
  .lang-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .lang-pill{padding:6px 13px;border-radius:999px;border:1px solid var(--border);font-size:12px;background:#fff;cursor:pointer;color:var(--muted);}
  .lang-pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .records-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;}
  @media (max-width:900px){.records-grid{grid-template-columns:1fr;}}
  .result-item{border:1.5px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;cursor:pointer;}
  .result-item:hover{border-color:var(--brand);}
  .result-item.active{border-color:var(--brand);background:var(--brand-light);}
  .result-item .name{font-weight:700;font-size:14px;color:var(--navy);}
  .result-item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .no-results{color:var(--muted);font-size:13.5px;padding:16px 0;}
  .scan-box{
    background:repeating-linear-gradient(0deg,#efe6d2,#efe6d2 22px,#e7dcc4 22px,#e7dcc4 24px);
    border:1px solid #d8caa9;border-radius:10px;height:130px;display:flex;align-items:center;justify-content:center;
    color:#8a7a52;font-size:12.5px;font-style:italic;margin-bottom:14px;
  }
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
  .field{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
  .field label{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .field div{font-size:13.5px;color:var(--ink);font-weight:600;margin-top:2px;}
  .doc-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;}
  .doc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px;}
  .doc-row:last-child{border-bottom:none;}
  .doc-row span{flex:1;color:var(--navy);font-weight:600;}

  /* ---------- pipeline / platform tab ---------- */
  .pipeline{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
  .pipe-step{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);min-width:158px;padding:16px 14px;box-shadow:var(--shadow);}
  .pipe-step .step-num{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;margin-bottom:10px;}
  .pipe-step h4{font-size:14px;margin-bottom:3px;}
  .pipe-step p{font-size:11.5px;color:var(--muted);margin:0;}
  .pipe-connector{align-self:center;color:var(--border);font-size:18px;padding:0 2px;flex:none;}
  .stack-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px;}
  @media (max-width:860px){.stack-grid{grid-template-columns:1fr;}}
  .stack-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .stack-head{padding:13px 18px;color:#fff;font-weight:700;font-size:14px;}
  .stack-row{display:flex;justify-content:space-between;padding:10px 18px;font-size:13px;border-top:1px solid var(--border);}
  .stack-row b{color:var(--navy);font-weight:600;}
  .stack-row span{color:var(--muted);text-align:right;}
  .stats-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:900px){.stats-4{grid-template-columns:repeat(2,1fr);}}
  .stat-card{border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .stat-card b{display:block;font-size:24px;font-family:Georgia,serif;margin-bottom:3px;}
  .stat-card span{font-size:12px;color:var(--muted);}
  .roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:860px){.roadmap{grid-template-columns:1fr;}}
  .phase-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .phase-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 11px;border-radius:999px;margin-bottom:10px;}

  footer{background:var(--navy);color:#c9d6e6;padding:40px 0 90px;font-size:13px;margin-top:20px;}
  @media (min-width:961px){footer{padding-bottom:32px;}}
  .footer-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:22px;margin-bottom:22px;}
  .footer-cols{display:flex;gap:50px;flex-wrap:wrap;}
  .footer-cols h5{color:#fff;font-size:12.5px;margin:0 0 9px;text-transform:uppercase;letter-spacing:1px;}
  .footer-cols a{display:block;color:#9fb0c4;text-decoration:none;margin-bottom:6px;font-size:12.5px;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,0.1);padding-top:16px;color:#7d93ab;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;}

  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ================= Icons ================= */
const Icon = ({ path, size = 20, color = "currentColor", strokeWidth=1.8 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
    {path}
  </svg>
);
const P = {
  home: <><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></>,

/* ================= small components ================= */
function StatusPill({status}){
  const map = {
    verified:["status-verified", P.check, "Verified"],
    review:["status-in-review", P.clock, "Pending Review"],
    "IN REVIEW":["status-in-review", P.clock, "In Review"],
    SUBMITTED:["status-submitted", P.clock, "Submitted"],
    ISSUED:["status-approved", P.check, "Issued"],
  };
  const [cls, icon, label] = map[status] || map.review;
  return <span className={"pill " + cls}><Icon path={icon} size={11}/>{label}</span>;
}

function DocketCard({app}){
  const rec = RECORDS.find(r => r.id === app.recordId);
  return (
    <div className="docket fade-in">
      <div className="docket-head">
        <div>
          <b style={{fontSize:14.5}}>{app.type}</b>
          <div className="docket-id">#{app.appId} · {rec ? rec.name : ""}</div>
        </div>
        <StatusPill status={app.status}/>
      </div>
      <div className="docket-fields">
        <div><span>Demarcation</span><b>{app.demarcation}</b></div>
        <div><span>Assigned Authority</span><b>{app.authority}</b></div>
      </div>
      <div className="progress-label"><span>Stage {app.stage} of 4: {STAGES[app.stage-1]}</span><span>{Math.round(app.stage/4*100)}%</span></div>
      <div className="progress-track">
        {[0,1,2,3].map(i => <div key={i} className={"progress-seg" + (i < app.stage ? " done" : "")}></div>)}
      </div>
      <div className="progress-dates"><span>Submitted: {app.submitted}</span><span>{app.eta.startsWith("Completed") ? app.eta : "Est. Completion: " + app.eta}</span></div>

}

          {trackedApp === "notfound" && <div className="no-results">No matching application found. Try BS-2025-8841 or a khasra number.</div>}
          {trackedApp && trackedApp !== "notfound" && <DocketCard app={trackedApp}/>}

      <section className="container section-tight">
        <div className="section-head">
          <div><h2>{t.coreServices}</h2><p>{t.coreServicesSub}</p></div>

/* ================= Land Records tab ================= */
function Records({t}){
  const [query, setQuery] = useState("");
  const [lang, setLang] = useState("All");
  const [selected, setSelected] = useState(RECORDS[0]);

  const results = useMemo(() => RECORDS.filter(r => {
    const matchesLang = lang === "All" || r.lang.startsWith(lang);
    const q = query.trim().toLowerCase();
    const matchesQuery = !q || r.name.toLowerCase().includes(q) || r.village.toLowerCase().includes(q) || r.khasra.toLowerCase().includes(q) || r.id.toLowerCase().includes(q);
    return matchesLang && matchesQuery;
  }), [query, lang]);

  return (
    <div className="container section fade-in">
      <div className="section-head"><div><h2>Search Digitised Land Records</h2><p>Search by name, village, or khasra/survey number across 20+ Indian scripts.</p></div></div>
      <div className="search-row">
        <input className="search-input" placeholder="Search by name, village, or khasra number…" value={query} onChange={e => setQuery(e.target.value)} />
        <button className="search-btn"><Icon path={P.search} size={14}/> Search</button>
      </div>
      <div className="lang-pills">{LANGS.map(l => <span key={l} className={"lang-pill" + (lang===l?" active":"")} onClick={() => setLang(l)}>{l}</span>)}</div>

      <div className="records-grid">
        <div>
          {results.length === 0 && <div className="no-results">No records match your search.</div>}
          {results.map(r => (
            <div key={r.id} className={"result-item" + (selected && selected.id===r.id ? " active" : "")} onClick={() => setSelected(r)}>
              <div className="name">{r.name}</div>
              <div className="meta">{r.village} · {r.khasra}</div>
              <StatusPill status={r.status}/>
            </div>
          ))}
        </div>
        <div>
          {selected ? (
            <div className="card" style={{padding:20}}>
              <div className="docket-head">
                <div><h4 style={{marginBottom:2}}>{selected.name}</h4><div className="record-sub" style={{color:"var(--muted)",fontSize:13}}>{selected.village} · {selected.lang}</div></div>
                <StatusPill status={selected.status}/>
              </div>
              <div className="scan-box">Scanned original register page (preserved as legal evidence)</div>
              <div className="field-grid">
                <div className="field"><label>Record ID</label><div>{selected.id}</div></div>
                <div className="field"><label>Khasra / Survey No.</label><div>{selected.khasra}</div></div>
                <div className="field"><label>Area</label><div>{selected.area}</div></div>
                <div className="field"><label>Script Detected</label><div>{selected.lang}</div></div>
              </div>
              <div className="mini-map" style={{height:110}}><div className="mini-pin" style={{left:selected.pinX, top:selected.pinY}}></div></div>
              <div style={{fontSize:12,fontWeight:700,color:"var(--navy)",margin:"14px 0 8px"}}>Linked Documents</div>
              <div className="doc-list">
                {selected.docs.map(d => (
                  <div className="doc-row" key={d.name}><Icon path={P.doc} size={15} color="var(--muted)"/><span>{d.name}</span>{d.verified ? <span className="pill status-verified"><Icon path={P.check} size={10}/>Verified</span> : <span className="pill status-in-review"><Icon path={P.clock} size={10}/>Pending</span>}</div>
                ))}
              </div>
              <div className="docket-actions">
                <button className="btn btn-primary btn-sm" onClick={() => alert("Demo only — issues a signed, tamper-evident PDF of the verified record.")}><Icon path={P.download} size={14}/> Download Signed Copy</button>
                <button className="btn btn-outline btn-sm" onClick={() => alert("Demo only — opens the full GIS plot boundary view.")}><Icon path={P.map} size={14}/> View on GIS Map</button>
              </div>
            </div>
          ) : <div className="no-results">Select a record to preview it.</div>}
        </div>
      </div>
    </div>
  );
}

/* ================= Applications tab ================= */
function Applications({t}){
  const [query, setQuery] = useState("");
  const results = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return APPLICATIONS;
    return APPLICATIONS.filter(a => a.appId.toLowerCase().includes(q) || a.type.toLowerCase().includes(q));
  }, [query]);

  return (
    <div className="container section fade-in">
      <div className="section-head"><div><h2>My Applications</h2><p>Track every mutation, registration, and title-check application in real time.</p></div></div>
      <div className="search-row">
        <input className="search-input" placeholder="Search by application ID or service type…" value={query} onChange={e => setQuery(e.target.value)} />
        <button className="search-btn"><Icon path={P.search} size={14}/> Search</button>
      </div>
      {results.length === 0 && <div className="no-results">No applications match your search.</div>}
      {results.map(a => <DocketCard app={a} key={a.appId}/>)}
    </div>
  );
}

/* ================= Documents tab ================= */
function Documents(){
  const allDocs = RECORDS.flatMap(r => r.docs.map(d => ({...d, owner:r.name, recordId:r.id})));
  return (
    <div className="container section fade-in">
      <div className="section-head"><div><h2>Documents</h2><p>All documents linked to your verified land records.</p></div></div>
      <div className="card" style={{padding:0}}>
        {allDocs.map((d,i) => (
          <div className="doc-row" key={i} style={{padding:"14px 18px"}}>
            <Icon path={P.doc} size={17} color="var(--muted)"/>
            <span>{d.name}<br/><span style={{fontSize:11,color:"var(--muted)",fontWeight:400}}>{d.owner} · #{d.recordId}</span></span>
            {d.verified ? <span className="pill status-verified"><Icon path={P.check} size={10}/>Verified</span> : <span className="pill status-in-review"><Icon path={P.clock} size={10}/>Pending</span>}
            <button className="btn btn-outline btn-sm" style={{marginLeft:10}} onClick={() => alert("Demo only — downloads this document.")}><Icon path={P.download} size={13}/></button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================= Platform tab (technical / hackathon content) ================= */
const PIPELINE = [
  { n:1, title:"Scan & Upload", desc:"Bulk scans, PDFs, mobile capture", color:"#2f6fb3" },
  { n:2, title:"Pre-processing", desc:"Deskew, denoise, binarise · OpenCV", color:"#1c7a4b" },
  { n:3, title:"OCR + HTR", desc:"PaddleOCR, Tesseract, TrOCR", color:"#c94f21" },
  { n:4, title:"Layout & NER", desc:"LayoutLMv3, IndicBERT, LLM → JSON", color:"#6b4fa0" },
  { n:5, title:"Human Verify", desc:"Confidence flags, officer sign-off", color:"#1c7a4b" },
  { n:6, title:"Search & GIS", desc:"PostGIS plot link, Elasticsearch", color:"#2f6fb3" },
];
const CORE_STACK = [["OCR & HTR","PaddleOCR, Tesseract, TrOCR"],["AI & NLP","PyTorch, IndicBERT, IndicNER"],["Document AI","LayoutLMv3, DocTR"],["Image Processing","OpenCV, Pillow"],["Backend","Python, FastAPI"],["Frontend","React.js, Next.js"],["Database","PostgreSQL, PostGIS"],["GIS","GeoServer, OpenLayers"]];
const PLATFORM_STACK = [["Search","Elasticsearch, pgvector"],["Language AI","BHASHINI, AI4Bharat"],["API & Integration","REST API, JSON"],["Security","Keycloak, OAuth 2.0, RBAC"],["Storage","MinIO / S3"],["Deployment","Docker, Kubernetes"],["Dashboard","ECharts, React"],["Monitoring","Prometheus, Grafana"]];
const STATS = [
  { big:"2 wks → 2 min", label:"Time to retrieve a certified record copy", bg:"var(--orange-light)", color:"#a8461f" },
  { big:"95%+", label:"Target field-level extraction accuracy after review", bg:"var(--brand-light)", color:"var(--brand-dark)" },
  { big:"20+", label:"Indian languages and scripts supported", bg:"var(--blue-light)", color:"var(--blue)" },
  { big:"~70%", label:"Reduction in manual data-entry effort", bg:"var(--purple-light)", color:"var(--purple)" },
];
const PHASES = [
  { tag:"Phase I", tagBg:"var(--orange-light)", tagColor:"#a8461f", title:"Blockchain-anchored title", text:"Tamper-evident hash of every verified record — one source of truth for banks and courts." },
  { tag:"Phase II", tagBg:"var(--brand-light)", tagColor:"var(--brand-dark)", title:"Drone & satellite survey", text:"Match textual records to actual parcel boundaries and auto-flag encroachment." },
  { tag:"Phase III", tagBg:"var(--blue-light)", tagColor:"var(--blue)", title:"Voice & chat assistant", text:"Ask “मेरी जमीन का खसरा” in any Indian language via BHASHINI speech and get the record." },
];

function Platform(){
  return (
    <div className="container section fade-in">
      <div className="section-head"><div><div className="eyebrow">For Hackathon Reviewers</div><h2>Platform &amp; AI Technology</h2><p>The engine behind the citizen experience — six stages, paper to public record.</p></div></div>

      <div className="pipeline">
        {PIPELINE.map((p,i) => (
          <React.Fragment key={p.n}>
            <div className="pipe-step"><div className="step-num" style={{background:p.color}}>{p.n}</div><h4>{p.title}</h4><p>{p.desc}</p></div>
            {i < PIPELINE.length-1 && <div className="pipe-connector">&rarr;</div>}
          </React.Fragment>
        ))}
      </div>

      <div className="stack-grid">
        <div className="stack-card"><div className="stack-head" style={{background:"var(--orange)"}}>Core Technology Stack</div>{CORE_STACK.map(([k,v]) => <div className="stack-row" key={k}><b>{k}</b><span>{v}</span></div>)}</div>
        <div className="stack-card"><div className="stack-head" style={{background:"var(--blue)"}}>Additional Platform Stack</div>{PLATFORM_STACK.map(([k,v]) => <div className="stack-row" key={k}><b>{k}</b><span>{v}</span></div>)}</div>
      </div>

      <div className="section-head" style={{marginTop:36}}><div><h2>Impact &amp; Benefits</h2></div></div>
      <div className="stats-4">
        {STATS.map(s => <div className="stat-card" key={s.label} style={{background:s.bg}}><b style={{color:s.color}}>{s.big}</b><span>{s.label}</span></div>)}
      </div>

      <div className="section-head" style={{marginTop:36}}><div><h2>Future Scope</h2></div></div>
      <div className="roadmap">
        {PHASES.map(p => (
          <div className="phase-card" key={p.tag}>
            <span className="phase-tag" style={{background:p.tagBg, color:p.tagColor}}>{p.tag}</span>
            <h4>{p.title}</h4><p style={{color:"var(--muted)",fontSize:14}}>{p.text}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================= Floating help + bottom nav ================= */

      <div className="float-help-inner">

function BottomNav({tab, setTab, t, moreOpen, setMoreOpen}){
  const main = [["home",t.navHome,P.home],["services",t.navServices,P.grid],["records",t.navRecords,P.fileSearch],["applications",t.navApplications,P.briefcase]];
  return (
    <React.Fragment>
      {moreOpen && (
        <div className="more-sheet fade-in">
          <div className="menu-item" onClick={() => {setTab("documents"); setMoreOpen(false);}}><Icon path={P.folder} size={16}/> {t.navDocuments}</div>
          <div className="menu-item" onClick={() => {setTab("platform"); setMoreOpen(false);}}><Icon path={P.layers} size={16}/> {t.navPlatform}</div>
          <div className="menu-item" onClick={() => setMoreOpen(false)}><Icon path={P.x} size={16}/> Close</div>
        </div>
      )}
      <div className="bottom-nav">
        {main.map(([id,label,icon]) => (
          <button key={id} className={tab===id?"active":""} onClick={() => {setTab(id); setMoreOpen(false);}}><Icon path={icon} size={19}/>{label}</button>
        ))}
        <button className={(tab==="documents"||tab==="platform")?"active":""} onClick={() => setMoreOpen(!moreOpen)}><Icon path={P.grid} size={19}/>{t.more}</button>

          <div className="footer-cols">

/* ================= App ================= */
function App(){
  const [tab, setTab] = useState("home");
  const [lang, setLang] = useState("en");
  const [moreOpen, setMoreOpen] = useState(false);
  const [trackQuery, setTrackQuery] = useState("");
  const [trackedApp, setTrackedApp] = useState(null);
  const [tracking, setTracking] = useState(false);
  const t = T[lang];

  const onTrack = (val) => {
    const q = (val !== undefined ? val : trackQuery).trim().toLowerCase();
    if (!q) return;
    setTracking(true);
    setTimeout(() => {
      const found = APPLICATIONS.find(a => a.appId.toLowerCase().includes(q)) ||
        (() => { const rec = RECORDS.find(r => r.khasra.toLowerCase().includes(q)); return rec ? APPLICATIONS.find(a => a.recordId === rec.id) : null; })();
      setTrackedApp(found || "notfound");
      setTracking(false);
    }, 500);
  };

  useEffect(() => { window.scrollTo(0,0); }, [tab]);

  return (
    <React.Fragment>
      <Header tab={tab} setTab={setTab} lang={lang} setLang={setLang} t={t}/>
      {tab==="home" && <Home setTab={setTab} t={t} lang={lang} trackQuery={trackQuery} setTrackQuery={setTrackQuery} trackedApp={trackedApp} onTrack={onTrack} tracking={tracking}/>}
      {tab==="services" && <Services setTab={setTab} t={t}/>}
      {tab==="records" && <Records t={t}/>}
      {tab==="applications" && <Applications t={t}/>}
      {tab==="documents" && <Documents/>}
      {tab==="platform" && <Platform/>}
      <Footer/>
      <FloatingHelp t={t}/>
      <BottomNav tab={tab} setTab={setTab} t={t} moreOpen={moreOpen} setMoreOpen={setMoreOpen}/>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
