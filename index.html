<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bhu-Abhilekh AI — Digitising Legacy Land Records</title>

<style>
  :root{
    --navy:#132a45;
    --navy-2:#1c3a5e;
    --orange:#e8622c;
    --orange-light:#fce8de;
    --green:#227a4b;
    --green-light:#e2f3e8;
    --blue:#2f6fb3;
    --blue-light:#e7f0fb;
    --purple:#6b4fa0;
    --purple-light:#f0eaf9;
    --ink:#1a2433;
    --muted:#5c6b7a;
    --bg:#f7f8fa;
    --card:#ffffff;
    --border:#e6e9ee;
    --radius:14px;
    --shadow:0 4px 18px rgba(19,42,69,0.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
  }
  img{max-width:100%;}
  a{color:inherit;}
  .container{max-width:1180px;margin:0 auto;padding:0 24px;}
  h1,h2,h3,h4{margin:0 0 8px;font-family:'Georgia','Times New Roman',serif;color:var(--navy);}
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:12.5px;
    font-weight:700;
    color:var(--orange);
    margin-bottom:10px;
  }
  .section{padding:76px 0;}
  .section-alt{background:#fff;}
  .section-head{max-width:680px;margin:0 auto 44px;text-align:center;}
  .section-head h2{font-size:34px;}
  .section-head p{color:var(--muted);font-size:16px;margin:0;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 24px;border-radius:999px;border:none;
    font-size:15px;font-weight:600;cursor:pointer;
    text-decoration:none;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(232,98,44,0.35);}
  .btn-ghost{background:rgba(255,255,255,0.12);color:#fff;border:1.5px solid rgba(255,255,255,0.5);}
  .btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--border);}

  /* NAV */
  header.nav{
    position:sticky;top:0;z-index:50;
    background:rgba(19,42,69,0.96);
    backdrop-filter:blur(6px);
  }
  .nav-inner{
    max-width:1180px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;
    color:#fff;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--orange),var(--green));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:Georgia,serif;font-weight:800;font-size:16px;
    flex:none;
  }
  .brand small{display:block;font-weight:400;font-size:11px;color:#b9c6d6;}
  nav.links{display:flex;gap:26px;font-size:14.5px;}
  nav.links a{opacity:0.85;text-decoration:none;}
  nav.links a:hover{opacity:1;}
  .nav-cta{display:flex;align-items:center;gap:14px;}
  .hamburger{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
  .mobile-menu{display:none;flex-direction:column;background:var(--navy-2);padding:10px 24px 18px;gap:12px;}
  .mobile-menu.open{display:flex;}
  @media (max-width:860px){
    nav.links{display:none;}
    .hamburger{display:block;}
  }

  /* HERO */
  .hero{
    background:radial-gradient(1200px 500px at 15% -10%, #234a70 0%, transparent 60%),
               linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 65%, #1f3d61 100%);
    color:#fff;padding:86px 0 70px;position:relative;overflow:hidden;
  }
  .hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:48px;align-items:center;}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr;}}
  .hero-tag{
    display:inline-block;background:rgba(232,98,44,0.18);color:#ffb98f;
    border:1px solid rgba(232,98,44,0.4);
    padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    margin-bottom:18px;
  }
  .hero h1{color:#fff;font-size:46px;line-height:1.12;margin-bottom:16px;}
  .hero h1 span{color:var(--orange);}
  .hero p.lead{color:#cfdaea;font-size:17px;max-width:520px;margin-bottom:28px;}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:36px;}
  .hero-stats{display:flex;gap:28px;flex-wrap:wrap;}
  .hero-stat b{display:block;font-size:24px;color:#fff;font-family:Georgia,serif;}
  .hero-stat span{font-size:12.5px;color:#9fb0c4;}

  .hero-visual{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;padding:20px;backdrop-filter:blur(4px);
  }
  .flow-card{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:12px;padding:14px 16px;
    display:flex;align-items:center;gap:12px;margin-bottom:10px;
    font-size:14px;
  }
  .flow-card .num{
    width:26px;height:26px;border-radius:50%;background:var(--orange);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;
  }
  .flow-arrow{text-align:center;color:#7d93ab;font-size:13px;margin:2px 0;}

  /* PROBLEM / SOLUTION cards */
  .cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:860px){.cards-3{grid-template-columns:1fr;}}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px;box-shadow:var(--shadow);
  }
  .icon-badge{
    width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;
  }
  .card h4{font-size:17px;margin-bottom:6px;}
  .card p{color:var(--muted);font-size:14.5px;margin:0;}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media (max-width:860px){.split{grid-template-columns:1fr;}}
  .panel{border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
  .panel-problem{background:var(--orange-light);border:1px solid #f5c9ae;}
  .panel-solution{background:var(--blue-light);border:1px solid #bcd6f2;}
  .panel-list{list-style:none;margin:16px 0 0;padding:0;}
  .panel-list li{
    display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(0,0,0,0.08);font-size:14.5px;color:var(--ink);
  }
  .panel-list li:last-child{border-bottom:none;}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;}

  /* PIPELINE */
  .pipeline{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
  .pipe-step{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    min-width:170px;padding:20px 16px;text-align:left;box-shadow:var(--shadow);position:relative;
  }
  .pipe-step .step-num{
    width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;margin-bottom:12px;
  }
  .pipe-step h4{font-size:15px;margin-bottom:4px;}
  .pipe-step p{font-size:12.5px;color:var(--muted);margin:0;}
  .pipe-connector{align-self:center;color:var(--border);font-size:20px;padding:0 2px;flex:none;}

  .stack-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px;}
  @media (max-width:860px){.stack-grid{grid-template-columns:1fr;}}
  .stack-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .stack-head{padding:16px 20px;color:#fff;font-weight:700;font-size:15px;}
  .stack-row{display:flex;justify-content:space-between;padding:12px 20px;font-size:14px;border-top:1px solid var(--border);}
  .stack-row b{color:var(--navy);font-weight:600;}
  .stack-row span{color:var(--muted);text-align:right;}

  /* DEMO */
  .demo-shell{
    background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
    overflow:hidden;
  }
  .demo-toolbar{background:var(--navy);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:10px;}
  .demo-toolbar .lights{display:flex;gap:6px;}
  .demo-toolbar .lights span{width:10px;height:10px;border-radius:50%;background:#3b5a7d;}
  .demo-toolbar .title{margin-left:8px;font-size:13px;color:#c9d6e6;}
  .demo-body{padding:26px;}
  .search-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .search-input{
    flex:1;min-width:220px;padding:13px 16px;border-radius:10px;border:1.5px solid var(--border);
    font-size:14.5px;outline:none;
  }
  .search-input:focus{border-color:var(--orange);}
  .search-btn{
    background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px 20px;
    font-weight:600;cursor:pointer;font-size:14.5px;
  }
  .lang-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .lang-pill{
    padding:6px 13px;border-radius:999px;border:1px solid var(--border);font-size:12.5px;
    background:#fff;cursor:pointer;color:var(--muted);
  }
  .lang-pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .demo-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;}
  @media (max-width:900px){.demo-grid{grid-template-columns:1fr;}}
  .result-item{
    border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .result-item:hover{border-color:var(--orange);}
  .result-item.active{border-color:var(--orange);background:var(--orange-light);}
  .result-item .name{font-weight:700;font-size:14.5px;color:var(--navy);}
  .result-item .meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:999px;margin-top:6px;
  }
  .badge-verified{background:var(--green-light);color:var(--green);}
  .badge-review{background:#fff4de;color:#9c6b0b;}
  .no-results{color:var(--muted);font-size:14px;padding:20px 0;}

  .record-card{border:1.5px solid var(--border);border-radius:14px;padding:20px;background:#fafbfc;}
  .record-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .record-head h4{margin:0;font-size:17px;}
  .record-sub{color:var(--muted);font-size:13px;}
  .scan-box{
    background:repeating-linear-gradient(0deg,#efe6d2,#efe6d2 22px,#e7dcc4 22px,#e7dcc4 24px);
    border:1px solid #d8caa9;border-radius:10px;height:150px;
    display:flex;align-items:center;justify-content:center;color:#8a7a52;font-size:13px;font-style:italic;
    margin-bottom:14px;
  }
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .field{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
  .field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .field div{font-size:14px;color:var(--ink);font-weight:600;margin-top:2px;}
  .map-box{
    height:110px;border-radius:10px;border:1px solid var(--border);
    background:
      linear-gradient(0deg, rgba(34,122,75,0.08) 1px, transparent 1px) 0 0/20px 20px,
      linear-gradient(90deg, rgba(34,122,75,0.08) 1px, transparent 1px) 0 0/20px 20px,
      var(--green-light);
    position:relative;margin-bottom:16px;overflow:hidden;
  }
  .map-pin{
    position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;
    background:var(--orange);transform:rotate(-45deg);
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
  }
  .demo-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .demo-note{
    margin-top:16px;font-size:12.5px;color:var(--muted);background:#fff;border:1px dashed var(--border);
    border-radius:10px;padding:10px 14px;
  }

  /* JOURNEY */
  .journey{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media (max-width:860px){.journey{grid-template-columns:1fr;}}
  .journey-col{border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);}
  .journey-today{background:#fff3ee;border:1px solid #f6cbb4;}
  .journey-new{background:var(--green-light);border:1px solid #b9e0c7;}
  .journey-steps{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
  .journey-step{
    background:rgba(255,255,255,0.7);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  .journey-arrow{align-self:center;color:var(--muted);}

  /* IMPACT STATS */
  .stats-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  @media (max-width:900px){.stats-4{grid-template-columns:repeat(2,1fr);}}
  .stat-card{
    border-radius:var(--radius);padding:22px;text-align:left;box-shadow:var(--shadow);
  }
  .stat-card b{display:block;font-size:28px;font-family:Georgia,serif;margin-bottom:4px;}
  .stat-card span{font-size:13px;color:var(--muted);}

  /* ROADMAP */
  .roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:860px){.roadmap{grid-template-columns:1fr;}}
  .phase-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);}
  .phase-tag{
    display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
    padding:4px 11px;border-radius:999px;margin-bottom:12px;
  }

  footer{background:var(--navy);color:#c9d6e6;padding:44px 0 28px;font-size:13.5px;}
  .footer-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;margin-bottom:24px;}
  .footer-cols{display:flex;gap:60px;flex-wrap:wrap;}
  .footer-cols h5{color:#fff;font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:1px;}
  .footer-cols a{display:block;color:#9fb0c4;text-decoration:none;margin-bottom:7px;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,0.1);padding-top:18px;color:#7d93ab;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
</style>
</head>

/* ---------------- Nav ---------------- */
function NavBar() {
  const [open, setOpen] = useState(false);

  return (

  return (

/* ---------------- Live Demo ---------------- */
function LiveDemo() {
  const [query, setQuery] = useState("");
  const [lang, setLang] = useState("All");
  const [selected, setSelected] = useState(RECORDS[0]);

  const results = useMemo(() => {
    return RECORDS.filter(r => {
      const matchesLang = lang === "All" || r.lang.startsWith(lang);
      const q = query.trim().toLowerCase();
      const matchesQuery = !q ||
        r.name.toLowerCase().includes(q) ||
        r.village.toLowerCase().includes(q) ||
        r.khasra.toLowerCase().includes(q) ||
        r.id.toLowerCase().includes(q);
      return matchesLang && matchesQuery;
    });
  }, [query, lang]);

  return (
    <section className="section" id="demo">
      <div className="container">
        <div className="section-head">
          <div className="eyebrow">Interactive Prototype</div>
          <h2>Search a Digitised Land Record</h2>
          <p>Mock dataset for demo purposes &mdash; search by name, village, or khasra/survey number, exactly like the citizen-facing portal.</p>
        </div>

        <div className="demo-shell">
          <div className="demo-toolbar">
            <div className="lights"><span></span><span></span><span></span></div>
            <span className="title">bhu-abhilekh.gov.in/search</span>
          </div>
          <div className="demo-body">
            <div className="search-row">
              <input
                className="search-input"
                placeholder="Search by name, village, or khasra number… e.g. Ramesh or Ludhiana"
                value={query}
                onChange={e => setQuery(e.target.value)}
              />
              <button className="search-btn" onClick={() => {}}>
                <Icon path={paths.search} size={15}/> Search
              </button>
            </div>
            <div className="lang-pills">
              {LANGS.map(l => (
                <span key={l} className={"lang-pill" + (lang === l ? " active" : "")} onClick={() => setLang(l)}>{l}</span>
              ))}
            </div>

            <div className="demo-grid">
              <div>
                {results.length === 0 && <div className="no-results">No records match your search. Try a different name or village.</div>}
                {results.map(r => (
                  <div
                    key={r.id}
                    className={"result-item" + (selected && selected.id === r.id ? " active" : "")}
                    onClick={() => setSelected(r)}
                  >
                    <div className="name">{r.name}</div>
                    <div className="meta">{r.village} · {r.khasra}</div>
                    <span className={"badge " + (r.status === "verified" ? "badge-verified" : "badge-review")}>
                      <Icon path={r.status === "verified" ? paths.check : paths.clock} size={11}/>
                      {r.status === "verified" ? "Verified Record" : "Pending Review"}
                    </span>
                  </div>
                ))}
              </div>

              <div>
                {selected ? (
                  <div className="record-card">
                    <div className="record-head">
                      <div>
                        <h4>{selected.name}</h4>
                        <div className="record-sub">{selected.village} · {selected.lang}</div>
                      </div>
                      <span className={"badge " + (selected.status === "verified" ? "badge-verified" : "badge-review")}>
                        <Icon path={selected.status === "verified" ? paths.check : paths.clock} size={11}/>
                        {selected.status === "verified" ? "Verified" : "In Review"}
                      </span>
                    </div>

                    <div className="scan-box">Scanned original register page (preserved as legal evidence)</div>

                    <div className="field-grid">
                      <div className="field"><label>Record ID</label><div>{selected.id}</div></div>
                      <div className="field"><label>Khasra / Survey No.</label><div>{selected.khasra}</div></div>
                      <div className="field"><label>Area</label><div>{selected.area}</div></div>
                      <div className="field"><label>Script Detected</label><div>{selected.lang}</div></div>
                    </div>

                    <div className="map-box">
                      <div className="map-pin" style={{left: selected.pinX, top: selected.pinY}}></div>
                    </div>

                    <div className="demo-actions">
                      <button className="btn btn-primary" style={{padding:"10px 18px", fontSize:13.5}} onClick={() => alert("Demo only — in production this issues a signed, tamper-evident PDF of the verified record.")}>
                        <Icon path={paths.download} size={15}/> Download Signed Copy
                      </button>
                      <button className="btn btn-outline" style={{padding:"10px 18px", fontSize:13.5}} onClick={() => alert("Demo only — opens the full GIS plot boundary view.")}>
                        <Icon path={paths.map} size={15}/> View on GIS Map
                      </button>
                    </div>
                  </div>
                ) : <div className="no-results">Select a record to preview it.</div>}

                <div className="demo-note">
                  This is a front-end prototype with sample data for the SIH 2026 pitch. In production, results are
                  served from the OCR + NER pipeline and PostGIS, with every field traceable to the original scan.
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}
